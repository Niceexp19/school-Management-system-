<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Registration - SMS</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-wrapper">
    <div class="auth-card">
        <h1>Parent Signup</h1>
        <p style="text-align: center; margin-bottom: 20px; color: #666;">Link your account with your child's student code</p>
        <form id="registerForm">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="parent@example.com">
            </div>
            <div class="form-group">
                <label for="student_code">Child's Student Code</label>
                <input type="text" id="student_code" required placeholder="e.g., ALX-8821">
                <small>Get this code from your child's teacher.</small>
            </div>
            <div class="form-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary">Request Access</button>
        </form>
        <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
            Already have an account? <a href="index.html" style="color: var(--accent-color);">Login</a>
        </p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Registration request submitted! Please wait for teacher approval.');
            window.location.href = 'index.html';
        });
    </script>
</body>
  </html>

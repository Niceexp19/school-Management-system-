<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Card - SMS</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>SMS Parent</h2>
            <nav>
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="results.html" class="active">View Results</a></li>
                    <li><a href="../index.html">Logout</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="header">
                <h1>Academic Report Card</h1>
                <button class="btn btn-primary" style="width: auto;" onclick="window.print()">Print Report</button>
            </header>

            <div class="card">
                <div style="text-align: center; margin-bottom: 20px;">
                    <h2>Alex Johnson - Grade 10</h2>
                    <p>Second Term 2025/2026</p>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>CA</th>
                            <th>Exam</th>
                            <th>Total</th>
                            <th>Grade</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Mathematics</td>
                            <td>24</td>
                            <td>54</td>
                            <td>78</td>
                            <td>B</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - SMS</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>SMS Teacher</h2>
            <nav>
                <ul>
                    <li><a href="dashboard.html" class="active">Dashboard</a></li>
                    <li><a href="students.html">Manage Students</a></li>
                    <li><a href="grades.html">Enter Grades</a></li>
                    <li><a href="../index.html">Logout</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header class="header">
                <h1>Teacher Overview</h1>
                <div class="user-info">Welcome, <strong>Mr. Smith</strong></div>
            </header>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px;">
                <div class="card" style="border-left: 5px solid var(--accent-color);">
                    <h3>My Students</h3>
                    <p style="font-size: 1.5rem; font-weight: bold;">60</p>
                    <small>Students you have registered</small>
                </div>
                <div class="card" style="border-left: 5px solid var(--success);">
                    <h3>Reports Created</h3>
                    <p style="font-size: 1.5rem; font-weight: bold;">12 Classes</p>
                </div>
            </div>

            <div class="card">
                <h3>Quick Actions</h3>
                <div style="display: flex; gap: 15px; margin-top: 15px;">
                    <a href="students.html" class="btn btn-primary" style="width: auto;">+ Register New Student</a>
                    <a href="grades.html" class="btn" style="background: var(--secondary-color); width: auto;">Enter Scores</a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
